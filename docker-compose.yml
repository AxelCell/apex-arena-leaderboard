# Full stack:            docker compose up -d --build
# Only MySQL + Redis:    docker compose up -d mysql redis   (then run the app from the IDE)
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/leaderboard
      DB_USER: leaderboard
      DB_PASSWORD: leaderboard
      REDIS_HOST: redis
      HMAC_SECRET: ${HMAC_SECRET:-dev-secret-change-me}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    # The JRE image has no curl, so speak HTTP over bash's /dev/tcp.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 5s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: leaderboard
      MYSQL_USER: leaderboard
      MYSQL_PASSWORD: leaderboard
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # Pure cache: no snapshots, so a restart starts empty and reloads from MySQL.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
