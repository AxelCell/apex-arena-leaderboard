# Run without Docker:  mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# In-memory H2 in MySQL compatibility mode; data is lost when the app stops.
spring.datasource.url=jdbc:h2:mem:leaderboard;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
leaderboard.cache.enabled=false
