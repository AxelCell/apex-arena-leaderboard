spring.application.name=leaderboard

# ---- Apex Arena game facts (must match data.py in the game)
game.fight-length-seconds=99
game.monsters=cindercub,tidepup,sproutle,zapret,fulgurr,vespike,gloomwisp,ironhorn,\
  golmoss,bulkox,zephyrax,sandrex,blazewing,krakoral,mossgore,oraclyx

# ---- Database: MySQL (start it with `docker compose up -d mysql`).
# Values can be overridden with environment variables, e.g. DB_URL in Docker.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leaderboard}
spring.datasource.username=${DB_USER:leaderboard}
spring.datasource.password=${DB_PASSWORD:leaderboard}

# Flyway owns the schema (src/main/resources/db/migration); Hibernate must not change it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Redis leaderboard cache (start it with `docker compose up -d redis`).
# Set leaderboard.cache.enabled=false to serve everything from MySQL.
leaderboard.cache.enabled=${CACHE_ENABLED:true}
leaderboard.cache.ttl=10m
leaderboard.cache.breaker-open-for=5s
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Short timeouts: if Redis is down we want to fall back to MySQL fast, not hang.
spring.data.redis.connect-timeout=500ms
spring.data.redis.timeout=500ms

# ---- Anti-cheat
# Shared secret for HMAC-SHA256 request signing. The default is for local development
# only; set HMAC_SECRET in any real deployment (and APEX_API_SECRET in the game).
leaderboard.hmac.enabled=${HMAC_ENABLED:true}
leaderboard.hmac.secret=${HMAC_SECRET:dev-secret-change-me}
leaderboard.hmac.max-skew-seconds=300
leaderboard.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
leaderboard.rate-limit.capacity=10
leaderboard.rate-limit.per-minute=20
leaderboard.anticheat.min-win-seconds=3

# ---- Actuator: /actuator/health for Docker/Kubernetes health checks
management.endpoints.web.exposure.include=health,info
# Redis is an optional cache (the app falls back to MySQL), so a Redis outage
# must not mark the whole service DOWN.
management.health.redis.enabled=false
